# HTTP: solo para el reto de Let's Encrypt; todo lo demás se manda a HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://seriartapp.tech$request_uri;
    }
}

# www -> dominio principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.seriartapp.tech;

    ssl_certificate     /etc/letsencrypt/live/seriartapp.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seriartapp.tech/privkey.pem;

    return 301 https://seriartapp.tech$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name seriartapp.tech;

    ssl_certificate     /etc/letsencrypt/live/seriartapp.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seriartapp.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
